<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen-Home</title>
</head>
<body>

    <div id="content">Poo</div>

    <script>
        fetch("temp.txt")
            .then(response => response.text())
            .then(text => {
                console.log("reached");
                const paragraph = document.createElement("p");
                paragraph.textContent = text;

                document.getElementById("content").appendChild(paragraph);
            })
            .catch(error => {
                console.error("Error reading temp.txt:", error);
            });
    </script>

</body>
</html>
